name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://matty:password@localhost:5432/task_manager_test
      JWT_SECRET: test-secret
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: task_manager_test
          POSTGRES_USER: matty
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/17754751501/locations/global/workloadIdentityPools/github-pool/subject/SUBJECT_ATTRIBUTE_VALUE
          service_account: github-actions@task-manager-api-505612.iam.gserviceaccount.com
      - name: Install dependencies
        run: npm ci
      - name: Run database migrations
        run: npm run migrate:test
      - name: Run tests
        run: npm run test:run